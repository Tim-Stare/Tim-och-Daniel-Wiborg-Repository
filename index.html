<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Riksdagen</title>
<link rel="icon" href="Riksdags.png" type="image/png">
<link rel="apple-touch-icon" href="Riksdags.png">
<style>
:root {
  --navy: #14213D;
  --navy-deep: #0D1730;
  --gold: #B9974D;
  --paper: #FFFFFF;
  --ink: #1A1A1A;
  --ink-soft: #5B6270;
  --line: #E4E6EC;
  --hover-bg: #E9EAEF;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: 'Inter', system-ui, sans-serif;
  min-height: 100%;
}

body {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar {
  width: 100%;
  background: var(--navy);
  border-bottom: 3px solid var(--navy-deep);
  box-shadow: inset 0 -1px 0 rgba(255,255,255,0.06);
  position: relative;
  z-index: 30;
}

.topbar-inner {
  max-width: 1180px;
  margin: 0 auto;
  padding: 22px 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

/* =========================================================
   RIKSDAGEN BRAND
========================================================= */

.riksdagen-brand {
  display: flex;
  align-items: center;
  gap: 14px;
  color: #FFFFFF;
  flex-shrink: 0;
}

.riksdagen-logo {
  height: 48px;
  width: auto;
  max-width: 160px;
  object-fit: contain;
  display: block;
  flex-shrink: 0;
}

.riksdagen-brand-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.riksdagen-brand-text strong {
  font-family: 'Source Serif 4', serif;
  font-size: 20px;
  font-weight: 600;
  line-height: 1.1;
}

.riksdagen-brand-text span {
  font-size: 11.5px;
  color: rgba(255,255,255,0.62);
  letter-spacing: 0.02em;
}

/* =========================================================
   TOP RIGHT
========================================================= */

.corner-stack {
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 18px;
  flex-shrink: 0;
  margin-left: auto;
}

.nav-area {
  flex-shrink: 0;
}

.nav-trigger {
  display: flex;
  align-items: center;
  gap: 8px;
  background: none;
  border: none;
  color: rgba(255,255,255,0.88);
  font-family: 'Inter', sans-serif;
  font-size: 14.5px;
  font-weight: 500;
  cursor: pointer;
  padding: 10px 4px;
  border-bottom: 2px solid transparent;
  transition: color 0.15s ease, border-color 0.15s ease;
}

.nav-trigger:hover,
.nav-trigger[aria-expanded="true"] {
  color: #FFFFFF;
  border-bottom-color: var(--gold);
}

.nav-trigger svg {
  transition: transform 0.2s ease;
  flex-shrink: 0;
}

.nav-trigger[aria-expanded="true"] svg {
  transform: rotate(180deg);
}

/* =========================================================
   NAV DROPDOWN
========================================================= */

.mega-dropdown {
  position: absolute;
  top: 100%;
  left: 0;
  width: 100%;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 16px 30px rgba(13, 23, 48, 0.16);
  opacity: 0;
  visibility: hidden;
  transform: translateY(-8px);
  transition:
    opacity 0.18s ease,
    transform 0.18s ease,
    visibility 0.18s;
  z-index: 20;
}

.mega-dropdown.open {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.mega-dropdown-inner {
  max-width: 1180px;
  margin: 0 auto;
  padding: 8px 28px;
}

.mega-dropdown ul {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
}

.mega-dropdown li {
  border-bottom: 3px solid transparent;
}

.mega-dropdown li.active {
  border-bottom-color: var(--gold);
}

.mega-dropdown li button {
  display: block;
  padding: 16px 22px;
  color: var(--ink);
  background: none;
  border: none;
  text-decoration: none;
  font-family: 'Inter', sans-serif;
  font-size: 14.5px;
  cursor: pointer;
  transition: background 0.12s ease, color 0.12s ease;
}

.mega-dropdown li.active button {
  color: var(--navy-deep);
  font-weight: 600;
}

.mega-dropdown li button:hover,
.mega-dropdown li button:focus-visible {
  background: var(--hover-bg);
  color: var(--navy-deep);
  outline: none;
}

/* =========================================================
   SEARCH
========================================================= */

.search-area {
  position: relative;
}

.search-form {
  display: flex;
  align-items: center;
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.28);
  border-radius: 3px;
  padding: 2px 4px 2px 14px;
  min-width: 220px;
  transition: background 0.15s ease, border-color 0.15s ease;
}

.search-form:focus-within {
  background: rgba(255,255,255,0.16);
  border-color: var(--gold);
}

.search-form input {
  background: transparent;
  border: none;
  outline: none;
  color: #FFFFFF;
  font-family: 'Inter', sans-serif;
  font-size: 14px;
  padding: 9px 6px;
  width: 100%;
}

.search-form input::placeholder {
  color: rgba(255,255,255,0.55);
}

.search-btn {
  background: none;
  border: none;
  cursor: pointer;
  padding: 7px 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: rgba(255,255,255,0.75);
  border-radius: 2px;
  transition: color 0.15s ease, background 0.15s ease;
}

.search-btn:hover {
  color: #FFFFFF;
  background: rgba(255,255,255,0.12);
}

/* =========================================================
   SEARCH RESULTS
========================================================= */

.search-results {
  position: absolute;
  top: calc(100% + 8px);
  right: 0;
  width: 320px;
  max-width: 80vw;
  max-height: 360px;
  overflow-y: auto;
  background: var(--paper);
  border: 1px solid var(--line);
  border-top: 3px solid var(--gold);
  box-shadow: 0 14px 28px rgba(13, 23, 48, 0.18);
  opacity: 0;
  visibility: hidden;
  transform: translateY(-6px);
  transition:
    opacity 0.15s ease,
    transform 0.15s ease,
    visibility 0.15s;
  z-index: 35;
}

.search-results.open {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.search-results ul {
  list-style: none;
  margin: 0;
  padding: 6px 0;
}

.search-results li + li {
  border-top: 1px solid var(--line);
}

.search-results li button {
  display: block;
  width: 100%;
  text-align: left;
  background: none;
  border: none;
  padding: 11px 16px;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  transition: background 0.12s ease;
}

.search-results li button:hover,
.search-results li button:focus-visible,
.search-results li button.is-highlighted {
  background: var(--hover-bg);
  outline: none;
}

.result-title {
  display: block;
  font-size: 14px;
  font-weight: 600;
  color: var(--navy-deep);
  margin-bottom: 2px;
}

.result-snippet {
  display: block;
  font-size: 12.5px;
  line-height: 1.5;
  color: var(--ink-soft);
}

.result-snippet mark {
  background: #F5E6C8;
  color: var(--ink);
  padding: 0 1px;
}

.search-results .no-results {
  padding: 14px 16px;
  font-size: 13.5px;
  color: var(--ink-soft);
}

/* =========================================================
   PAGE BODY
========================================================= */

main {
  max-width: 780px;
  margin: 0 auto;
  padding: 56px 28px 72px;
  flex: 1;
  width: 100%;
}

#pageContent {
  opacity: 1;
  transform: translateY(0);
  transition: opacity 0.22s ease, transform 0.22s ease;
}

#pageContent.swap-out {
  opacity: 0;
  transform: translateY(8px);
}

/* =========================================================
   GENERAL TEXT
========================================================= */

.warning {
  display: block;
  background: #FBF4E9;
  border-left: 3px solid var(--gold);
  color: #6B4E1C;
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.01em;
  line-height: 1.6;
  padding: 14px 18px;
  margin: 0 0 32px;
}

.intro {
  font-family: 'Source Serif 4', serif;
  font-size: 20px;
  line-height: 1.55;
  color: var(--navy-deep);
  margin: 0 0 8px;
}

.credit {
  font-size: 14px;
  color: var(--ink-soft);
  margin: 0 0 40px;
}

.page-eyebrow {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.03em;
  color: var(--gold);
  text-transform: uppercase;
  margin: 0 0 10px;
}

.page-title {
  font-family: 'Source Serif 4', serif;
  font-weight: 600;
  font-size: 30px;
  color: var(--navy-deep);
  margin: 0 0 22px;
}

h2 {
  font-family: 'Source Serif 4', serif;
  font-weight: 600;
  font-size: 20px;
  color: var(--navy-deep);
  margin: 36px 0 12px;
}

h2:first-child {
  margin-top: 0;
}

p {
  font-size: 15px;
  line-height: 1.7;
  color: var(--ink);
  margin: 0 0 10px;
}

ul {
  margin: 0 0 10px;
  padding-left: 20px;
}

li {
  font-size: 15px;
  line-height: 1.7;
  color: var(--ink);
  margin-bottom: 4px;
}

/* =========================================================
   MANDATE TABLE
========================================================= */

.table-scroll {
  overflow-x: auto;
  margin: 0 0 28px;
}

.party-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}

.party-table th {
  text-align: left;
  font-size: 12.5px;
  font-weight: 600;
  letter-spacing: 0.03em;
  text-transform: uppercase;
  color: var(--ink-soft);
  padding: 0 12px 10px;
  border-bottom: 2px solid var(--navy);
  white-space: nowrap;
}

.party-table td {
  padding: 14px 12px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}

.party-table td:first-child {
  font-weight: 600;
  color: var(--navy-deep);
  white-space: normal;
  min-width: 180px;
}

.party-table .party-cell {
  display: flex;
  align-items: center;
  gap: 10px;
}

.party-table .party-logo {
  width: 28px;
  height: 28px;
  object-fit: cover;
  border-radius: 4px;
  flex-shrink: 0;
  border: 1px solid var(--line);
}

.party-table td.num {
  text-align: right;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}

.party-table td.seats {
  font-weight: 600;
  color: var(--ink);
  text-align: right;
  font-variant-numeric: tabular-nums;
}

.party-table .swatch {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  flex-shrink: 0;
  display: inline-block;
}

.party-table .bar-cell {
  min-width: 140px;
  width: 28%;
}

.vote-bar-wrap {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.vote-bar-track {
  height: 10px;
  background: var(--line);
  border-radius: 5px;
  overflow: hidden;
}

.vote-bar-fill {
  height: 100%;
  border-radius: 5px;
  min-width: 2px;
}

.vote-bar-meta {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  font-size: 12px;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}

.vote-bar-meta strong {
  color: var(--navy-deep);
  font-weight: 600;
}

/* Live clock — bottom right */
.live-clock {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 50;
  background: var(--navy-deep);
  color: #FFFFFF;
  border: 1px solid rgba(185, 151, 77, 0.45);
  border-radius: 6px;
  padding: 10px 14px;
  font-family: 'Inter', system-ui, sans-serif;
  box-shadow: 0 8px 20px rgba(13, 23, 48, 0.22);
  text-align: right;
  line-height: 1.35;
  pointer-events: none;
}

.live-clock .clock-time {
  font-size: 16px;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
  letter-spacing: 0.02em;
}

.live-clock .clock-date {
  font-size: 12px;
  color: rgba(255, 255, 255, 0.72);
  margin-top: 2px;
}

/* =========================================================
   MANDATE IMAGE
========================================================= */

.mandate-year {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.06em;
  color: var(--ink-soft);
  text-transform: uppercase;
  margin: 0 0 4px;
}

.mandate-note {
  font-size: 12.5px;
  color: var(--ink-soft);
  margin: 0 0 20px;
}

.numbers-png-wrap {
  margin: 0 0 28px;
}

.numbers-png {
  display: block;
  width: 100%;
  height: auto;
  border: 1px solid var(--line);
}

.numbers-png-fallback {
  display: none;
  align-items: center;
  justify-content: center;
  text-align: center;
  min-height: 180px;
  border: 1px dashed var(--line);
  background: #FAFAFB;
  color: var(--ink-soft);
  font-size: 13.5px;
  padding: 20px;
  margin: 0;
}

.numbers-png-wrap.missing .numbers-png {
  display: none;
}

.numbers-png-wrap.missing .numbers-png-fallback {
  display: flex;
}

/* =========================================================
   LEADER CARDS
========================================================= */

.leader-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 14px;
  margin: 20px 0 28px;
}

.leader-card {
  position: relative;
  aspect-ratio: 3 / 4;
  overflow: hidden;
  border: 1px solid var(--line);
  cursor: pointer;
  transition:
    transform 0.15s ease,
    box-shadow 0.15s ease,
    border-color 0.15s ease;
}

.leader-card:hover {
  transform: translateY(-3px);
  border-color: var(--gold);
  box-shadow: 0 8px 18px rgba(13, 23, 48, 0.12);
}

.leader-card.selected {
  border-color: var(--gold);
  box-shadow: 0 0 0 2px rgba(185,151,77,0.18);
}

.leader-photo-wrap {
  position: relative;
  width: 100%;
  height: 100%;
}

.leader-photo-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.leader-photo-fallback {
  position: absolute;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
}

.leader-photo-wrap.missing .leader-photo-img {
  display: none;
}

.leader-photo-wrap.missing .leader-photo-fallback {
  display: flex;
}

.leader-silhouette {
  width: 58%;
  height: 58%;
  fill: rgba(255,255,255,0.55);
}

.leader-caption {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: 10px 10px 9px;
  background: linear-gradient(
    to top,
    rgba(13,23,48,0.92),
    rgba(13,23,48,0.0)
  );
  opacity: 0;
  transform: translateY(6px);
  transition: opacity 0.18s ease, transform 0.18s ease;
}

.leader-card:hover .leader-caption,
.leader-card:focus-within .leader-caption,
.leader-card.selected .leader-caption {
  opacity: 1;
  transform: translateY(0);
}

.leader-name {
  font-size: 13px;
  font-weight: 600;
  color: #FFFFFF;
  line-height: 1.3;
}

.leader-party {
  font-size: 11.5px;
  color: rgba(255,255,255,0.8);
  line-height: 1.3;
}

/* =========================================================
   LEADER INFORMATION BOX
========================================================= */

.leader-info {
  display: none;
  margin: -12px 0 30px;
  padding: 16px 18px;
  border: 1px solid var(--line);
  border-top: 3px solid var(--gold);
  background: #FAFAFB;
  animation: leaderInfoIn 0.18s ease;
}

.leader-info.open {
  display: block;
}

.leader-info-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.leader-info-name {
  font-family: 'Source Serif 4', serif;
  font-size: 18px;
  font-weight: 600;
  color: var(--navy-deep);
}

.leader-info-party {
  font-size: 12px;
  color: var(--ink-soft);
  margin-top: 2px;
}

.leader-info-close {
  border: none;
  background: none;
  color: var(--ink-soft);
  font-size: 18px;
  cursor: pointer;
  padding: 4px 7px;
}

.leader-info-close:hover {
  color: var(--navy-deep);
  background: var(--hover-bg);
}

.leader-info-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.leader-info-item {
  padding: 10px 12px;
  background: #FFFFFF;
  border: 1px solid var(--line);
}

.leader-info-label {
  display: block;
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  font-weight: 600;
  color: var(--ink-soft);
  margin-bottom: 4px;
}

.leader-info-value {
  display: block;
  font-size: 13.5px;
  color: var(--navy-deep);
  font-weight: 500;
}

@keyframes leaderInfoIn {
  from {
    opacity: 0;
    transform: translateY(-5px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* =========================================================
   FÖRDELAR / NACKDELAR
========================================================= */

.party-proscons {
  margin: 0 0 32px;
}

.party-proscons h2 {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
}

.party-proscons h2 .swatch {
  width: 13px;
  height: 13px;
}

.party-proscons h2 .party-logo {
  width: 26px;
  height: 26px;
  object-fit: cover;
  border-radius: 4px;
  flex-shrink: 0;
  border: 1px solid var(--line);
}

.proscons-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.proscons-col {
  border: 1px solid var(--line);
  padding: 14px 16px;
}

.proscons-col.pros {
  border-top: 4px solid #2E7D32;
}

.proscons-col.cons {
  border-top: 4px solid #B3261E;
}

.proscons-col h4 {
  font-family: 'Source Serif 4', serif;
  font-size: 13px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--ink-soft);
  margin: 0 0 8px;
}

.proscons-col p {
  margin: 0;
  font-size: 14px;
}

@media (max-width: 560px) {
  .proscons-grid {
    grid-template-columns: 1fr;
  }
}

/* =========================================================
   BLOCKS
========================================================= */

.bloc-summary {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin: 0 0 28px;
}

.bloc-card {
  border: 1px solid var(--line);
  border-top: 4px solid var(--navy);
  padding: 16px 18px;
}

.bloc-card h3 {
  font-family: 'Source Serif 4', serif;
  font-weight: 600;
  font-size: 16.5px;
  color: var(--navy-deep);
  margin: 0 0 12px;
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 8px;
}

.bloc-card .bloc-total {
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 14px;
  color: var(--ink-soft);
  white-space: nowrap;
}

.party-chips {
  list-style: none;
  margin: 0;
  padding: 0;
}

.party-chips li {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 14px;
  padding: 5px 0;
}

.party-chips .swatch {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  flex-shrink: 0;
  display: inline-block;
}

.party-chips .party-seats {
  margin-left: auto;
  font-weight: 600;
  color: var(--ink);
}

/* =========================================================
   FOOTER
========================================================= */

footer {
  width: 100%;
  background: var(--navy-deep);
}

.footer-inner {
  max-width: 1180px;
  margin: 0 auto;
  padding: 18px 28px;
  text-align: center;
}

.footer-inner p {
  margin: 0;
  font-size: 13px;
  color: rgba(255,255,255,0.65);
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media (max-width: 720px) {
  .topbar-inner {
    padding: 16px 20px;
  }

  .search-form {
    min-width: 0;
    width: 200px;
  }

  .search-results {
    width: 100%;
    right: 0;
  }

  .leader-info-grid {
    grid-template-columns: 1fr 1fr;
  }
}

@media (max-width: 560px) {
  .bloc-summary {
    grid-template-columns: 1fr;
  }

  .leader-info-grid {
    grid-template-columns: 1fr;
  }

  .riksdagen-brand-text span {
    display: none;
  }

  .riksdagen-logo {
    height: 36px;
    max-width: 100px;
  }

  .search-form {
    width: 140px;
  }
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
    animation: none !important;
  }
}
</style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">

  <div class="topbar-inner">

    <!-- RIKSDAGEN BRAND -->

    <div class="riksdagen-brand">

function calculateAge(birthISO) {
  if (!birthISO) {
    return "Ej angiven";
  }

  const birth = new Date(birthISO + "T00:00:00");

  const today = new Date();

  let age = today.getFullYear() - birth.getFullYear();

  const birthDayThisYear = new Date(
    today.getFullYear(),
    birth.getMonth(),
    birth.getDate()
  );

  if (today < birthDayThisYear) {
    age--; 
  }

  return age + " år";
}

/* =========================================================
   LEADER INFORMATION
========================================================= */

function showLeaderInfo(card, leader, info) {
  const wasOpen = info.classList.contains("open");

  document
    .querySelectorAll(".leader-card.selected")
    .forEach((item) => {
      item.classList.remove("selected");
    });

  if (
    wasOpen &&
    info.dataset.currentLeader === leader.code
  ) {
    info.classList.remove("open");
    return;
  }

  card.classList.add("selected");

  info.querySelector(".leader-info-name").textContent = leader.name;
  info.querySelector(".leader-info-party").textContent = leader.party;

  info.querySelector(".leader-age").textContent =
    calculateAge(leader.birthISO);

  info.querySelector(".leader-birth").textContent =
    leader.birth;

  info.querySelector(".leader-gender").textContent =
    leader.gender;

  info.querySelector(".leader-joined").textContent =
    leader.joined;

  info.dataset.currentLeader = leader.code;

  info.classList.add("open");
}

/* =========================================================
   LEADER GRID
========================================================= */

function renderLeaderGrid(containerId, leaders) {
  const el = document.getElementById(containerId);

  if (!el) {
    return;
  }

  el.innerHTML = leaders.map((leader, index) => `
    <div
      class="leader-card"
      tabindex="0"
      role="button"
      data-leader-container="${containerId}"
      data-leader-index="${index}"
      aria-label="Visa information om ${leader.name}"
    >

      <div class="leader-photo-wrap ${leader.photo ? '' : 'missing'}">

        ${leader.photo ? `
          <img
            class="leader-photo-img"
            src="${leader.photo}"
            alt="${leader.name}"
            onerror="
              this.closest('.leader-photo-wrap')
                .classList.add('missing')
            "
          >
        ` : `
          <img class="leader-photo-img" src="" alt="" style="display:none;">
        `}

        <div
          class="leader-photo-fallback"
          style="background:${leader.color}"
        >
          <svg
            class="leader-silhouette"
            viewBox="0 0 100 100"
            aria-hidden="true"
          >
            <circle cx="50" cy="36" r="18"/>
            <path d="M15 96c0-24.85 15.67-39 35-39s35 14.15 35 39"/>
          </svg>
        </div>
      </div>

      <div class="leader-caption">
        <span class="leader-name">${leader.name}</span>
        <span class="leader-party">${leader.party}</span>
      </div>
    </div>
  `).join('');

  const info = document.createElement('div');
  info.className = 'leader-info';
  info.id = containerId + '-info';
  info.innerHTML = `
    <div class="leader-info-header">
      <div>
        <div class="leader-info-name"></div>
        <div class="leader-info-party"></div>
      </div>
      <button type="button" class="leader-info-close" aria-label="Stäng information">×</button>
    </div>

    <div class="leader-info-grid">
      <div class="leader-info-item">
        <span class="leader-info-label">Ålder</span>
        <span class="leader-info-value leader-age"></span>
      </div>
      <div class="leader-info-item">
        <span class="leader-info-label">Född</span>
        <span class="leader-info-value leader-birth"></span>
      </div>
      <div class="leader-info-item">
        <span class="leader-info-label">Kön</span>
        <span class="leader-info-value leader-gender"></span>
      </div>
      <div class="leader-info-item">
        <span class="leader-info-label">Medlem sedan</span>
        <span class="leader-info-value leader-joined"></span>
      </div>
    </div>
  `;

  el.insertAdjacentElement('afterend', info);

  const cards = el.querySelectorAll('.leader-card');

  cards.forEach((card) => {
    const index = Number(card.dataset.leaderIndex);
    const leader = leaders[index];

    card.addEventListener('click', () => {
      showLeaderInfo(card, leader, info);
    });

    card.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        showLeaderInfo(card, leader, info);
      }
    });
  });

  info.querySelector('.leader-info-close').addEventListener('click', () => {
    info.classList.remove('open');
    cards.forEach((card) => card.classList.remove('selected'));
  });
}

/* =========================================================
   NAVIGATION RENDERING
========================================================= */

function renderNav() {
  const navListEl = document.getElementById('navList');
  navListEl.innerHTML = '';

  NAV_ORDER.forEach((key) => {
    const li = document.createElement('li');

    if (key === currentPage) {
      li.classList.add('active');
    }

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = NAV[key];
    btn.addEventListener('click', () => {
      goToPage(key);
      closeNav();
    });

    li.appendChild(btn);
    navListEl.appendChild(li);
  });
}

/* =========================================================
   PAGE RENDERING
========================================================= */

function renderPage() {
  pageContentEl.innerHTML = PAGES[currentPage];

  if (currentPage === 'partier') {
    renderLeaderGrid('leaderGridPartier', RIKSDAGS_LEADERS);
  }

  if (currentPage === 'utanfors') {
    renderLeaderGrid('leaderGridUtanfor', UTANFOR_LEADERS);
  }
}

/* =========================================================
   PAGE SWITCHING
========================================================= */

let currentPage = 'hem';

const pageContentEl = document.getElementById('pageContent');
const navListEl = document.getElementById('navList');

function goToPage(key) {
  if (key === currentPage) {
    return;
  }

  pageContentEl.classList.add('swap-out');
  window.setTimeout(() => {
    currentPage = key;
    renderPage();
    renderNav();
    pageContentEl.classList.remove('swap-out');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }, 200);
}

/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

/* =========================================================
   SEARCH
========================================================= */

const SEARCH_ITEMS = Object.keys(PAGES).map((key) => ({
  key,
  title: NAV[key] || key,
  content: PAGES[key]
}));

const searchInputEl = document.getElementById('searchInput');
const searchFormEl = document.getElementById('searchForm');
const searchResultsEl = document.getElementById('searchResults');

let currentResults = [];
let highlightedIndex = -1;

function closeSearch() {
  searchResultsEl.classList.remove('open');
  searchInputEl.setAttribute('aria-expanded', 'false');
  highlightedIndex = -1;
}

function openSearch() {
  searchResultsEl.classList.add('open');
  searchInputEl.setAttribute('aria-expanded', 'true');
}

function stripHtml(html) {
  return html
    .replace(/<[^>]+>/g, ' ')
    .replace(/&amp;/g, '&')
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"')
    .replace(/&#39;/g, "'")
    .trim();
}

function buildSnippet(content, query) {
  const lower = content.toLowerCase();
  const idx = lower.indexOf(query);
  if (idx === -1) {
    const short = content.slice(0, 90);
    return escapeHtml(short) + (content.length > 90 ? '…' : '');
  }

  const start = Math.max(0, idx - 40);
  const end = Math.min(content.length, idx + query.length + 40);
  const snippet = content.slice(start, end);

  const before = escapeHtml(snippet.slice(0, idx - start));
  const match = escapeHtml(snippet.slice(idx - start, idx - start + query.length));
  const after = escapeHtml(snippet.slice(idx - start + query.length));

  return `${before}<mark>${match}</mark>${after}`;
}

function runSearch(rawQuery) {
  const query = rawQuery.trim().toLowerCase();
  if (!query) {
    searchResultsEl.innerHTML = '';
    closeSearch();
    return;
  }

  const results = SEARCH_ITEMS
    .filter((item) => {
      const title = item.title.toLowerCase();
      const body = stripHtml(item.content).toLowerCase();
      return title.includes(query) || body.includes(query);
    })
    .slice(0, 8)
    .map((item) => ({
      key: item.key,
      title: item.title,
      snippet: buildSnippet(stripHtml(item.content), query)
    }));

  currentResults = results;
  highlightedIndex = -1;

  if (results.length === 0) {
    searchResultsEl.innerHTML = `<p class="no-results">Inga resultat för "${escapeHtml(rawQuery)}".</p>`;
    openSearch();
    return;
  }

  const ul = document.createElement('ul');

  results.forEach((result) => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.innerHTML = `
      <span class="result-title">${escapeHtml(result.title)}</span>
      <span class="result-snippet">${result.snippet}</span>
    `;
    btn.addEventListener('click', () => {
      selectResult(result.key);
    });
    li.appendChild(btn);
    ul.appendChild(li);
  });

  searchResultsEl.innerHTML = '';
  searchResultsEl.appendChild(ul);
  openSearch();
}

function selectResult(key) {
  closeNav();
  goToPage(key);
  closeSearch();
}

function updateHighlight() {
  const buttons = searchResultsEl.querySelectorAll('li button');
  buttons.forEach((btn, i) => {
    btn.classList.toggle('is-highlighted', i === highlightedIndex);
  });
}

let searchDebounce;
searchInputEl.addEventListener('input', () => {
  window.clearTimeout(searchDebounce);
  const value = searchInputEl.value;

  searchDebounce = window.setTimeout(() => {
    runSearch(value);
  }, 120);
});

searchFormEl.addEventListener('submit', (e) => {
  e.preventDefault();

  if (highlightedIndex >= 0 && currentResults[highlightedIndex]) {
    selectResult(currentResults[highlightedIndex].key);
  } else if (currentResults.length > 0) {
    selectResult(currentResults[0].key);
  }
});

searchInputEl.addEventListener('keydown', (e) => {
  if (!currentResults.length) {
    return;
  }

  if (e.key === 'ArrowDown') {
    e.preventDefault();
    highlightedIndex = Math.min(highlightedIndex + 1, currentResults.length - 1);
    updateHighlight();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    highlightedIndex = Math.max(highlightedIndex - 1, -1);
    updateHighlight();
  } else if (e.key === 'Escape') {
    closeSearch();
  }
});

document.addEventListener('click', (e) => {
  if (
    !searchResultsEl.contains(e.target) &&
    e.target !== searchInputEl &&
    !searchFormEl.contains(e.target)
  ) {
    closeSearch();
  }
});

/* =========================================================
   NAV TOGGLE
========================================================= */

const navTrigger = document.getElementById('navTrigger');
const navDropdown = document.getElementById('navDropdown');

function closeNav() {
  navDropdown.classList.remove('open');
  navTrigger.setAttribute('aria-expanded', 'false');
}

function toggleNav() {
  const isOpen = navDropdown.classList.toggle('open');
  navTrigger.setAttribute('aria-expanded', String(isOpen));
}

navTrigger.addEventListener('click', (e) => {
  e.stopPropagation();
  toggleNav();
});

document.addEventListener('click', (e) => {
  if (
    !navDropdown.contains(e.target) &&
    e.target !== navTrigger &&
    !navTrigger.contains(e.target)
  ) {
    closeNav();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeNav();
    closeSearch();
  }
});

/* =========================================================
   LIVE CLOCK
========================================================= */

const clockTimeEl = document.getElementById('clockTime');
const clockDateEl = document.getElementById('clockDate');

const SVEDAGAR = [
  'söndag', 'måndag', 'tisdag', 'onsdag', 'torsdag', 'fredag', 'lördag'
];

const SVEMÅNADER = [
  'januari', 'februari', 'mars', 'april', 'maj', 'juni',
  'juli', 'augusti', 'september', 'oktober', 'november', 'december'
];

function pad2(num) {
  return String(num).padStart(2, '0');
}

function updateLiveClock() {
  const now = new Date();

  clockTimeEl.textContent =
    pad2(now.getHours()) + ':' +
    pad2(now.getMinutes()) + ':' +
    pad2(now.getSeconds());

  clockDateEl.textContent =
    SVEDAGAR[now.getDay()] + ' ' +
    now.getDate() + ' ' +
    SVEMÅNADER[now.getMonth()] + ' ' +
    now.getFullYear();
}

updateLiveClock();
window.setInterval(updateLiveClock, 1000);

renderNav();
renderPage();
</script>
