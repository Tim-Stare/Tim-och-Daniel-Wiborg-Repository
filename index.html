<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riksdagen</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #14213D;
    --navy-deep: #0D1730;
    --gold: #B9974D;
    --paper: #FFFFFF;
    --ink: #1A1A1A;
    --ink-soft: #5B6270;
    --line: #E4E6EC;
    --hover-bg: #E9EAEF;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    min-height: 100%;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  /* ---------- TOP BAR ---------- */
  .topbar {
    width: 100%;
    background: var(--navy);
    border-bottom: 3px solid var(--navy-deep);
    box-shadow: inset 0 -1px 0 rgba(255,255,255,0.06);
    position: relative;
    z-index: 30;
  }

  .topbar-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 22px 28px;
    display: flex;
    justify-content: flex-end;
  }

  /* Right-hand stack: search on top, Utforska trigger below it */
  .corner-stack {
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 10px;
    flex-shrink: 0;
  }

  .nav-area {
    flex-shrink: 0;
  }

  .nav-trigger {
    display: flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: none;
    color: rgba(255,255,255,0.88);
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    font-weight: 500;
    cursor: pointer;
    padding: 10px 4px;
    border-bottom: 2px solid transparent;
    transition: color 0.15s ease, border-color 0.15s ease;
  }

  .nav-trigger:hover,
  .nav-trigger[aria-expanded="true"] {
    color: #FFFFFF;
    border-bottom-color: var(--gold);
  }

  .nav-trigger svg {
    transition: transform 0.2s ease;
    flex-shrink: 0;
  }

  .nav-trigger[aria-expanded="true"] svg {
    transform: rotate(180deg);
  }

  /* Full-width panel that drops below the navy border */
  .mega-dropdown {
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    box-shadow: 0 16px 30px rgba(13, 23, 48, 0.16);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-8px);
    transition: opacity 0.18s ease, transform 0.18s ease, visibility 0.18s;
    z-index: 20;
  }

  .mega-dropdown.open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .mega-dropdown-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 8px 28px;
  }

  .mega-dropdown ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-wrap: wrap;
  }

  /* gold marker sits UNDER the item, only shown once it's the active one */
  .mega-dropdown li {
    border-bottom: 3px solid transparent;
  }

  .mega-dropdown li.active {
    border-bottom-color: var(--gold);
  }

  .mega-dropdown li button {
    display: block;
    padding: 16px 22px;
    color: var(--ink);
    background: none;
    border: none;
    text-decoration: none;
    font-family: 'Inter', sans-serif;
    font-size: 14.5px;
    cursor: pointer;
    transition: background 0.12s ease, color 0.12s ease;
  }

  .mega-dropdown li.active button {
    color: var(--navy-deep);
    font-weight: 600;
  }

  /* darken on hover, rather than lighten */
  .mega-dropdown li button:hover,
  .mega-dropdown li button:focus-visible {
    background: var(--hover-bg);
    color: var(--navy-deep);
    outline: none;
  }

  /* Search */
  .search-area {
    position: relative;
  }

  .search-form {
    display: flex;
    align-items: center;
    background: rgba(255,255,255,0.10);
    border: 1px solid rgba(255,255,255,0.28);
    border-radius: 3px;
    padding: 2px 4px 2px 14px;
    min-width: 220px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .search-form:focus-within {
    background: rgba(255,255,255,0.16);
    border-color: var(--gold);
  }

  .search-form input {
    background: transparent;
    border: none;
    outline: none;
    color: #FFFFFF;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    padding: 9px 6px;
    width: 100%;
  }

  .search-form input::placeholder {
    color: rgba(255,255,255,0.55);
  }

  .search-btn {
    background: none;
    border: none;
    cursor: pointer;
    padding: 7px 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,0.75);
    border-radius: 2px;
    transition: color 0.15s ease, background 0.15s ease;
  }

  .search-btn:hover {
    color: #FFFFFF;
    background: rgba(255,255,255,0.12);
  }

  /* Search results dropdown */
  .search-results {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    width: 320px;
    max-width: 80vw;
    max-height: 360px;
    overflow-y: auto;
    background: var(--paper);
    border: 1px solid var(--line);
    border-top: 3px solid var(--gold);
    box-shadow: 0 14px 28px rgba(13, 23, 48, 0.18);
    opacity: 0;
    visibility: hidden;
    transform: translateY(-6px);
    transition: opacity 0.15s ease, transform 0.15s ease, visibility 0.15s;
    z-index: 35;
  }

  .search-results.open {
    opacity: 1;
    visibility: visible;
    transform: translateY(0);
  }

  .search-results ul {
    list-style: none;
    margin: 0;
    padding: 6px 0;
  }

  .search-results li + li {
    border-top: 1px solid var(--line);
  }

  .search-results li button {
    display: block;
    width: 100%;
    text-align: left;
    background: none;
    border: none;
    padding: 11px 16px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: background 0.12s ease;
  }

  .search-results li button:hover,
  .search-results li button:focus-visible,
  .search-results li button.is-highlighted {
    background: var(--hover-bg);
    outline: none;
  }

  .result-title {
    display: block;
    font-size: 14px;
    font-weight: 600;
    color: var(--navy-deep);
    margin-bottom: 2px;
  }

  .result-snippet {
    display: block;
    font-size: 12.5px;
    line-height: 1.5;
    color: var(--ink-soft);
  }

  .result-snippet mark {
    background: #F5E6C8;
    color: var(--ink);
    padding: 0 1px;
  }

  .search-results .no-results {
    padding: 14px 16px;
    font-size: 13.5px;
    color: var(--ink-soft);
  }

  /* Party results table (Mandat page) */
  .table-scroll {
    overflow-x: auto;
    margin: 0 0 28px;
  }

  .party-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  .party-table th {
    text-align: left;
    font-size: 12.5px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--ink-soft);
    padding: 0 12px 10px;
    border-bottom: 2px solid var(--navy);
    white-space: nowrap;
  }

  .party-table td {
    padding: 11px 12px;
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }

  .party-table td:first-child {
    display: flex;
    align-items: center;
    gap: 9px;
    font-weight: 600;
    color: var(--navy-deep);
    white-space: normal;
  }

  .party-table td:nth-child(3),
  .party-table td:nth-child(4) {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .party-table td:last-child {
    font-weight: 600;
    color: var(--ink);
  }

  .party-table .swatch {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    flex-shrink: 0;
    display: inline-block;
  }

  /* ---------- PAGE BODY ---------- */
  main {
    max-width: 780px;
    margin: 0 auto;
    padding: 56px 28px 72px;
    flex: 1;
    width: 100%;
  }

  #pageContent {
    opacity: 1;
    transform: translateY(0);
    transition: opacity 0.22s ease, transform 0.22s ease;
  }

  #pageContent.swap-out {
    opacity: 0;
    transform: translateY(8px);
  }

  .warning {
    display: block;
    background: #FBF4E9;
    border-left: 3px solid var(--gold);
    color: #6B4E1C;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.01em;
    line-height: 1.6;
    padding: 14px 18px;
    margin: 0 0 32px;
  }

  .intro {
    font-family: 'Source Serif 4', serif;
    font-size: 20px;
    line-height: 1.55;
    color: var(--navy-deep);
    margin: 0 0 8px;
  }

  .credit {
    font-size: 14px;
    color: var(--ink-soft);
    margin: 0 0 40px;
  }

  .page-eyebrow {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.03em;
    color: var(--gold);
    text-transform: uppercase;
    margin: 0 0 10px;
  }

  .page-title {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 30px;
    color: var(--navy-deep);
    margin: 0 0 22px;
  }

  h2 {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 20px;
    color: var(--navy-deep);
    margin: 36px 0 12px;
  }

  h2:first-child { margin-top: 0; }

  p {
    font-size: 15px;
    line-height: 1.7;
    color: var(--ink);
    margin: 0 0 10px;
  }

  ul {
    margin: 0 0 10px;
    padding-left: 20px;
  }

  li {
    font-size: 15px;
    line-height: 1.7;
    color: var(--ink);
    margin-bottom: 4px;
  }

  /* ---------- MANDATE CHART IMAGE ---------- */
  .mandate-year {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    text-transform: uppercase;
    margin: 0 0 4px;
  }

  .mandate-note {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin: 0 0 20px;
  }

  .numbers-png-wrap {
    margin: 0 0 28px;
  }

  .numbers-png {
    display: block;
    width: 100%;
    height: auto;
    border: 1px solid var(--line);
  }

  .numbers-png-fallback {
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    min-height: 180px;
    border: 1px dashed var(--line);
    background: #FAFAFB;
    color: var(--ink-soft);
    font-size: 13.5px;
    padding: 20px;
    margin: 0;
  }

  .numbers-png-wrap.missing .numbers-png {
    display: none;
  }

  .numbers-png-wrap.missing .numbers-png-fallback {
    display: flex;
  }

  /* ---------- LEADER CARDS (Partier / Utanför Riksdag) ---------- */
  .leader-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 14px;
    margin: 20px 0 28px;
  }

  .leader-card {
    position: relative;
    aspect-ratio: 3 / 4;
    overflow: hidden;
    border: 1px solid var(--line);
  }

  .leader-photo-wrap {
    position: relative;
    width: 100%;
    height: 100%;
  }

  .leader-photo-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .leader-photo-fallback {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
  }

  .leader-photo-wrap.missing .leader-photo-img {
    display: none;
  }

  .leader-photo-wrap.missing .leader-photo-fallback {
    display: flex;
  }

  .leader-silhouette {
    width: 58%;
    height: 58%;
    fill: rgba(255,255,255,0.55);
  }

  .leader-caption {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    display: flex;
    flex-direction: column;
    gap: 1px;
    padding: 10px 10px 9px;
    background: linear-gradient(to top, rgba(13,23,48,0.92), rgba(13,23,48,0.0));
    opacity: 0;
    transform: translateY(6px);
    transition: opacity 0.18s ease, transform 0.18s ease;
  }

  .leader-card:hover .leader-caption,
  .leader-card:focus-within .leader-caption {
    opacity: 1;
    transform: translateY(0);
  }

  .leader-name {
    font-size: 13px;
    font-weight: 600;
    color: #FFFFFF;
    line-height: 1.3;
  }

  .leader-party {
    font-size: 11.5px;
    color: rgba(255,255,255,0.8);
    line-height: 1.3;
  }

  .bloc-summary {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin: 0 0 28px;
  }

  .bloc-card {
    border: 1px solid var(--line);
    border-top: 4px solid var(--navy);
    padding: 16px 18px;
  }

  .bloc-card h3 {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 16.5px;
    color: var(--navy-deep);
    margin: 0 0 12px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 8px;
  }

  .bloc-card .bloc-total {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 14px;
    color: var(--ink-soft);
    white-space: nowrap;
  }

  .party-chips {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  .party-chips li {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 14px;
    padding: 5px 0;
  }

  .party-chips .swatch {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    flex-shrink: 0;
    display: inline-block;
  }

  .party-chips .party-seats {
    margin-left: auto;
    font-weight: 600;
    color: var(--ink);
  }

  @media (max-width: 560px) {
    .bloc-summary { grid-template-columns: 1fr; }
  }

  /* ---------- FOOTER ---------- */
  footer {
    width: 100%;
    background: var(--navy-deep);
  }

  .footer-inner {
    max-width: 1180px;
    margin: 0 auto;
    padding: 18px 28px;
    text-align: center;
  }

  .footer-inner p {
    margin: 0;
    font-size: 13px;
    color: rgba(255,255,255,0.65);
  }

  /* ---------- RESPONSIVE ---------- */
  @media (max-width: 720px) {
    .topbar-inner {
      padding: 16px 20px;
    }
    .search-form { min-width: 0; width: 200px; }
    .search-results { width: 100%; right: 0; }
    .mega-dropdown ul { flex-direction: column; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-inner">

      <div class="corner-stack">

        <div class="search-area">
          <form class="search-form" role="search" id="searchForm">
            <input
              type="search"
              name="q"
              id="searchInput"
              placeholder="Sökfält"
              aria-label="Sökfält"
              autocomplete="off"
              role="combobox"
              aria-expanded="false"
              aria-controls="searchResults"
              aria-autocomplete="list"
            >
            <button class="search-btn" type="submit" aria-label="Sök">
              <svg width="17" height="17" viewBox="0 0 17 17" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="7.2" cy="7.2" r="5.7" stroke="currentColor" stroke-width="1.6"/>
                <line x1="11.4" y1="11.6" x2="15.5" y2="15.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </button>
          </form>
          <div class="search-results" id="searchResults" role="listbox"></div>
        </div>

        <div class="nav-area">
          <button class="nav-trigger" id="navTrigger" aria-expanded="false" aria-haspopup="true" aria-controls="navDropdown">
            <span>Utforska</span>
            <svg width="11" height="7" viewBox="0 0 11 7" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M1 1L5.5 5.5L10 1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>

      </div>
    </div>

    <div class="mega-dropdown" id="navDropdown" role="menu">
      <div class="mega-dropdown-inner">
        <ul id="navList"></ul>
      </div>
    </div>
  </div>

  <main>
    <div id="pageContent"></div>
  </main>

  <footer>
    <div class="footer-inner">
      <p>© 2026 Tim Stare &amp; Daniel Wiborg — Tyresö Gymnasium</p>
    </div>
  </footer>

<script>
/* ---------------------------------------------------------
   CONTENT: nav labels and page bodies (Swedish)
--------------------------------------------------------- */
const NAV = {
  hem: "Hem",
  partier: "Partier",
  historia: "Historia",
  mandat: "Mandat",
  riksdagslinjen: "4 Procentsspärren",
  utanfor: "Utanför Riksdag (4 Partier)"
};

const NAV_ORDER = ["hem", "partier", "historia", "mandat", "riksdagslinjen", "utanfor"];

const PAGES = {
  hem: `
    <p class="warning">Varning: den här sidan tar upp kritik mot både Tidöpartierna och Vänsterblocket. Ingen sida framställs som felfri.</p>
    <p class="intro">En webbplats som förklarar hur Sverige styrs: riksdagens 349 mandat, hur en regering bildas och hur partierna grupperar sig i block.</p>
    <p class="credit">Skapad av Tim Stare &amp; Daniel Wiborg (EE25c), Tyresö Gymnasium</p>
    <h2>Om projektet</h2>
    <p>Sidan ger en balanserad översikt av svensk politik med fokus på fyra ämnen: hur riksdag och regering fungerar, blocken, deras för- och nackdelar, och de fyra största partierna utanför riksdagen.</p>
    <h2>Exempel på innehåll</h2>
    <p>Nackdelar som lyfts fram, för en ärlig bild:</p>
    <ul>
      <li>Vänsterpartiets historiska kopplingar till kommunism och omdiskuterade uttalanden</li>
      <li>SD-ledarens tidigare koppling till en högerextrem rörelse</li>
    </ul>
    <p>Partier utanför riksdagen som kan ta sig in inom 4–8 år:</p>
    <ul>
      <li>Alternativ för Sverige (AfS)</li>
      <li>Örebropartiet (ÖP)</li>
      <li>Kristna Värdepartiet</li>
      <li>Ambition Sverige</li>
    </ul>
    <h2>Syfte</h2>
    <p>Vi byggde sidan för att:</p>
    <ul>
      <li>göra svensk politik enklare att förstå</li>
      <li>visa både styrkor och svagheter hos blocken, mer öppet än vad stora medier ofta gör</li>
      <li>ge en bild av partier utanför riksdagen som kan ta sig in framöver</li>
    </ul>
  `,
  partier: `
    <p class="page-eyebrow">Utforska</p>
    <h1 class="page-title">Partier</h1>
    <p>Här kommer en genomgång av riksdagspartierna och de två blocken: Tidöpartierna och Vänsterblocket. Innehållet fylls i här efter hand.</p>

    <h2>Partiledarna</h2>
    <div class="leader-grid" id="leaderGridPartier"></div>
  `,
  historia: `
    <p class="page-eyebrow">Utforska</p>
    <h1 class="page-title">Historia</h1>
    <p>En kort genomgång av riksdagens nästan 600 år långa historia — från medeltida möten till dagens system med 349 mandat.</p>

    <h2>Ståndsriksdagen (1435–1866)</h2>
    <p>Riksdagens rötter går tillbaka till mötet i Arboga 1435, som brukar räknas som Sveriges första riksdag. Vid Gustav Vasas riksmöten i Västerås 1527 och 1544 fick riksdagen sin klassiska form med fyra stånd: adel, präster, borgare och bönder. Varje stånd röstade för sig, och det var bara en minoritet av befolkningen som hade rösträtt.</p>

    <h2>Tvåkammarriksdagen (1866–1970)</h2>
    <p>1809 fick Sverige en ny regeringsform som delade makten mellan kung och riksdag. 1866 avskaffades ståndsriksdagen helt och ersattes med en tvåkammarriksdag — en första och en andra kammare. Rösträtten var fortfarande begränsad, ofta kopplad till inkomst och kön.</p>

    <h2>Demokratins genombrott (1918–1921)</h2>
    <p>1918 infördes allmän och lika rösträtt för män, och 1921 även för kvinnor. Valet 1921 var det första där både kvinnor och män röstade på lika villkor, och räknas som startpunkten för Sverige som en fullvärdig demokrati.</p>

    <h2>Enkammarriksdagen (1971–idag)</h2>
    <p>1971 avskaffades tvåkammarsystemet och ersattes med dagens enkammarriksdag, till en början med 350 mandat. Valet 1973 slutade exakt lika, 175 mot 175, vilket ledde till att flera beslut fick avgöras genom lottning — kallat "lotteririksdagen". För att undvika att det skulle hända igen minskades antalet mandat till 349 från och med 1976, ett udda tal som alltid ger en majoritet.</p>
  `,
  mandat: `
    <p class="page-eyebrow">Utforska</p>
    <h1 class="page-title">Mandat</h1>
    <p>Riksdagen har 349 mandat totalt. Efter valet grupperar sig partierna i två block: Vänsterblocket (Oppositionen) och Tidöpartierna. Varje prick nedan är ett mandat, färgat efter parti.</p>

    <p class="mandate-year">2026</p>
    <p class="mandate-note">Resultat efter valet 13 september 2026, samtliga 6 626 valdistrikt räknade. Enligt Valmyndigheten kvarstår resultatet som preliminärt tills det är formellt fastställt.</p>

    <div class="numbers-png-wrap">

let currentPage = "hem";

const pageContentEl = document.getElementById('pageContent');

/* ---------------------------------------------------------
   LEADER CARDS: one rectangle per party leader. A photo slot
   (leader-photo) plus a caption that slides in from the
   bottom on hover, showing the leader's name and party.
   Photos aren't embedded yet — supply image files and I can
   drop them into leader-photo as data URIs.
--------------------------------------------------------- */
const RIKSDAG_LEADERS = [
  { code: "S",  name: "Magdalena Andersson",       party: "Socialdemokraterna (S)",   color: "#E8112D" },

  { code: "V",  name: "Mehrnoosh Dadgostar",       party: "Vänsterpartiet (V)",       color: "#AF1E2D" },
  { code: "C",  name: "Elisabeth Thand Ringqvist", party: "Centerpartiet (C)",        color: "#009933" },
  { code: "KD", name: "Ebba Busch",                party: "Kristdemokraterna (KD)",   color: "#000077" },

function renderLeaderGrid(containerId, leaders) {
  const el = document.getElementById(containerId);
  if (!el) return;
  el.innerHTML = leaders.map((l) => `
    <div class="leader-card">
      <div class="leader-photo-wrap">
        <img

          <svg class="leader-silhouette" viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="36" r="18"/>
            <path d="M15 96c0-24.85 15.67-39 35-39s35 14.15 35 39"/>
          </svg>
        </div>

      <div class="leader-caption">

        <span class="leader-party">${escapeHtml(l.party)}</span>

function renderNav() {
  navListEl.innerHTML = "";
  NAV_ORDER.forEach((key) => {
    const li = document.createElement('li');
    li.setAttribute('role', 'none');
    if (key === currentPage) li.classList.add('active');
    const btn = document.createElement('button');
    btn.setAttribute('role', 'menuitem');
    btn.type = 'button';
    btn.textContent = NAV[key];
    btn.addEventListener('click', () => {
      goToPage(key);
      closeNav();
    });
    li.appendChild(btn);
    navListEl.appendChild(li);
  });
}

function renderPage() {
  pageContentEl.innerHTML = PAGES[currentPage];
  if (currentPage === 'partier') renderLeaderGrid('leaderGridPartier', RIKSDAG_LEADERS);
  if (currentPage === 'utanfor') renderLeaderGrid('leaderGridUtanfor', OUTSIDE_LEADERS);
}

function goToPage(key) {
  if (key === currentPage) return;
  pageContentEl.classList.add('swap-out');
  window.setTimeout(() => {
    currentPage = key;
    renderPage();
    Array.from(navListEl.children).forEach((li, i) => {
      li.classList.toggle('active', NAV_ORDER[i] === currentPage);
    });
    pageContentEl.classList.remove('swap-out');
  }, 200);
}

renderNav();
renderPage();

/* ---------------------------------------------------------
   SEARCH: indexes every page's title and plain-text content,
   shows live matching suggestions as you type, and jumps to
   the matching page using the same smooth swap as Utforska.
--------------------------------------------------------- */
const SEARCH_TITLES = Object.assign({ hem: "Hem" }, NAV);

function stripHtml(html) {
  return html
    .replace(/<[^>]*>/g, ' ')
    .replace(/&amp;/g, '&')
    .replace(/\s+/g, ' ')
    .trim();
}

const SEARCH_INDEX = Object.keys(PAGES).map((key) => ({
  key: key,
  title: SEARCH_TITLES[key] || key,
  content: stripHtml(PAGES[key])
}));

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function buildSnippet(content, query) {
  const lower = content.toLowerCase();
  const idx = lower.indexOf(query);
  if (idx === -1) {
    const short = content.slice(0, 90);
    return escapeHtml(short) + (content.length > 90 ? '…' : '');
  }
  const start = Math.max(0, idx - 40);
  const end = Math.min(content.length, idx + query.length + 50);
  const snippet = content.slice(start, end);
  const relIdx = idx - start;
  const before = escapeHtml(snippet.slice(0, relIdx));
  const match = escapeHtml(snippet.slice(relIdx, relIdx + query.length));
  const after = escapeHtml(snippet.slice(relIdx + query.length));
  return (start > 0 ? '…' : '') + before + '<mark>' + match + '</mark>' + after + (end < content.length ? '…' : '');
}

function runSearch(rawQuery) {
  const query = rawQuery.trim().toLowerCase();
  if (!query) return [];
  return SEARCH_INDEX
    .filter((item) => item.title.toLowerCase().includes(query) || item.content.toLowerCase().includes(query))
    .sort((a, b) => {
      const aTitleHit = a.title.toLowerCase().includes(query) ? 0 : 1;
      const bTitleHit = b.title.toLowerCase().includes(query) ? 0 : 1;
      return aTitleHit - bTitleHit;
    })
    .map((item) => ({
      key: item.key,
      title: item.title,
      snippet: buildSnippet(item.content, query)
    }));
}

const searchInputEl = document.getElementById('searchInput');
const searchFormEl = document.getElementById('searchForm');
const searchResultsEl = document.getElementById('searchResults');

let currentResults = [];
let highlightedIndex = -1;

function closeSearch() {
  searchResultsEl.classList.remove('open');
  searchInputEl.setAttribute('aria-expanded', 'false');
  highlightedIndex = -1;
}

function openSearch() {
  searchResultsEl.classList.add('open');
  searchInputEl.setAttribute('aria-expanded', 'true');
}

function selectResult(key) {
  closeNav();
  goToPage(key);
  closeSearch();
}

function renderSearchResults(results, query) {
  currentResults = results;
  highlightedIndex = -1;

  if (!query.trim()) {
    searchResultsEl.innerHTML = '';
    closeSearch();
    return;
  }

  if (results.length === 0) {
    searchResultsEl.innerHTML = `<p class="no-results">Inga resultat för "${escapeHtml(query)}"</p>`;
    openSearch();
    return;
  }

  const ul = document.createElement('ul');
  results.forEach((r) => {
    const li = document.createElement('li');
    li.setAttribute('role', 'none');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.setAttribute('role', 'option');
    btn.innerHTML = `<span class="result-title">${escapeHtml(r.title)}</span><span class="result-snippet">${r.snippet}</span>`;
    btn.addEventListener('click', () => selectResult(r.key));
    li.appendChild(btn);
    ul.appendChild(li);
  });
  searchResultsEl.innerHTML = '';
  searchResultsEl.appendChild(ul);
  openSearch();
}

function updateHighlight() {
  const buttons = searchResultsEl.querySelectorAll('li button');
  buttons.forEach((btn, i) => {
    btn.classList.toggle('is-highlighted', i === highlightedIndex);
    if (i === highlightedIndex) btn.scrollIntoView({ block: 'nearest' });
  });
}

let searchDebounce;
searchInputEl.addEventListener('input', () => {
  window.clearTimeout(searchDebounce);
  const value = searchInputEl.value;
  searchDebounce = window.setTimeout(() => {
    renderSearchResults(runSearch(value), value);
  }, 120);
});

searchInputEl.addEventListener('focus', () => {
  if (searchInputEl.value.trim() && currentResults.length) openSearch();
});

searchFormEl.addEventListener('submit', (e) => {
  e.preventDefault();
  if (highlightedIndex >= 0 && currentResults[highlightedIndex]) {
    selectResult(currentResults[highlightedIndex].key);
  } else if (currentResults.length > 0) {
    selectResult(currentResults[0].key);
  }
});

searchInputEl.addEventListener('keydown', (e) => {
  if (!currentResults.length) return;
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    highlightedIndex = Math.min(highlightedIndex + 1, currentResults.length - 1);
    updateHighlight();
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    highlightedIndex = Math.max(highlightedIndex - 1, -1);
    updateHighlight();
  } else if (e.key === 'Escape') {
    closeSearch();
  }
});

document.addEventListener('click', (e) => {
  if (!searchResultsEl.contains(e.target) && e.target !== searchInputEl && !searchFormEl.contains(e.target)) {
    closeSearch();
  }
});

/* ---------------------------------------------------------
   Dropdown open/close behaviour
--------------------------------------------------------- */
const navTrigger = document.getElementById('navTrigger');
const navDropdown = document.getElementById('navDropdown');

function closeNav() {
  navDropdown.classList.remove('open');
  navTrigger.setAttribute('aria-expanded', 'false');
}
function toggleNav() {
  const isOpen = navDropdown.classList.toggle('open');
  navTrigger.setAttribute('aria-expanded', String(isOpen));
}
navTrigger.addEventListener('click', (e) => {
  e.stopPropagation();
  toggleNav();
});

document.addEventListener('click', (e) => {
  if (!navDropdown.contains(e.target) && e.target !== navTrigger && !navTrigger.contains(e.target)) {
    closeNav();
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    closeNav();
  }
});
</script>
